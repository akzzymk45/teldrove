name: Upload Movie to TelDrive

on:
  workflow_dispatch:
    inputs:
      movie_url:
        description: 'Direct Download URL of the Movie (e.g., http://.../movie.mp4)'
        required: true
        type: string
      file_name:
        description: 'File Name to save as (e.g., Inception.mp4)'
        required: true
        type: string
      folder_name:
        description: 'Target Folder in TelDrive'
        required: false
        default: 'github'
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Install Custom Teldrive Rclone
        run: |
          echo "Downloading custom Rclone..."
          wget -q https://github.com/tgdrive/rclone/releases/download/v1.73.1/rclone-v1.73.1-linux-amd64.zip
          unzip -q rclone-v1.73.1-linux-amd64.zip
          sudo mv rclone-v1.73.1-linux-amd64/rclone /usr/bin/rclone
          sudo chmod +x /usr/bin/rclone
          rm -rf rclone-v1.73.1-linux-amd64*

      - name: 🚀 Install Official TelDrive Binary
        run: |
          echo "Downloading TelDrive 1.8.3..."
          wget -q https://github.com/tgdrive/teldrive/releases/download/1.8.3/teldrive-1.8.3-linux-amd64.tar.gz
          tar -xzf teldrive-1.8.3-linux-amd64.tar.gz
          sudo mv teldrive /usr/bin/teldrive
          sudo chmod +x /usr/bin/teldrive
          rm -f teldrive-1.8.3-linux-amd64.tar.gz

      - name: 🌐 Start TelDrive Server in Background
        run: |
          echo "Booting up TelDrive Server..."
          teldrive run \
            --db-data-source="${{ secrets.TELDRIVE_SUPABASE_DSN }}" \
            --jwt-secret="${{ secrets.TELDRIVE_JWT_SECRET }}" \
            --tg-app-id="${{ secrets.TELDRIVE_TG_APP_ID }}" \
            --tg-app-hash="${{ secrets.TELDRIVE_TG_APP_HASH }}" \
            --tg-uploads-encryption-key="${{ secrets.TELDRIVE_TG_UPLOADS_ENCRYPTION_KEY }}" &
          
          # Wait 10 seconds to ensure the server starts properly
          sleep 10
          
      - name: 🔑 Configure Rclone Authentication
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [teldrive]
          type = webdav
          url = http://localhost:8080/webdav
          vendor = other
          bearer_token = ${{ secrets.TELDRIVE_TOKEN }}
          EOF

      - name: 📥 Download Movie to Azure Runner
        run: |
          echo "Downloading movie from URL to Azure fast servers..."
          wget -q --show-progress -O "${{ github.event.inputs.file_name }}" "${{ github.event.inputs.movie_url }}"

      - name: ☁️ Upload Movie to Telegram via TelDrive
        run: |
          echo "Uploading to TelDrive Folder: teldrive:${{ github.event.inputs.folder_name }}"
          rclone copy "${{ github.event.inputs.file_name }}" teldrive:${{ github.event.inputs.folder_name }}/ -v --progress
          
      - name: 🧹 Cleanup Space
        run: |
          echo "Upload complete! Deleting local file to free up runner space..."
          rm -f "${{ github.event.inputs.file_name }}"
