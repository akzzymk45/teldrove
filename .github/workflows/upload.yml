name: Ultimate Batch Movie Uploader

on:
  workflow_dispatch:
    inputs:
      movie_urls:
        description: 'Direct Download URLs (Separate multiple links with a SPACE)'
        required: true
        type: string
      folder_name:
        description: 'Target Folder in TelDrive'
        required: false
        default: 'Remote'
        type: string
      chat_id:
        description: 'Telegram Chat ID to notify'
        required: false
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Install Tools (Aria2 & Custom Rclone)
        run: |
          sudo apt-get update && sudo apt-get install -y aria2
          wget -q https://github.com/tgdrive/rclone/releases/download/v1.73.1/rclone-v1.73.1-linux-amd64.zip
          unzip -q rclone-v1.73.1-linux-amd64.zip
          sudo mv rclone-v1.73.1-linux-amd64/rclone /usr/bin/rclone
          sudo chmod +x /usr/bin/rclone
          rm -rf rclone-v1.73.1-linux-amd64*

      - name: 🚀 Install Official TelDrive Binary
        run: |
          wget -q https://github.com/tgdrive/teldrive/releases/download/1.8.3/teldrive-1.8.3-linux-amd64.tar.gz
          tar -xzf teldrive-1.8.3-linux-amd64.tar.gz
          sudo mv teldrive /usr/bin/teldrive
          sudo chmod +x /usr/bin/teldrive
          rm -f teldrive-1.8.3-linux-amd64.tar.gz

      - name: 🌐 Start TelDrive Server in Background
        run: |
          teldrive run \
            --db-data-source="${{ secrets.TELDRIVE_SUPABASE_DSN }}" \
            --jwt-secret="${{ secrets.TELDRIVE_JWT_SECRET }}" \
            --tg-app-id="${{ secrets.TELDRIVE_TG_APP_ID }}" \
            --tg-app-hash="${{ secrets.TELDRIVE_TG_APP_HASH }}" \
            --tg-uploads-encryption-key="${{ secrets.TELDRIVE_TG_UPLOADS_ENCRYPTION_KEY }}" &
          sleep 10
          
      - name: 🔑 Configure Rclone Authentication
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [teldrive]
          type = teldrive
          api_host = http://127.0.0.1:8080/
          access_token = ${{ secrets.TELDRIVE_TOKEN }}
          chunk_size = 100M
          upload_concurrency = 8
          encrypt_files = false
          random_chunk_name = true
          EOF

      - name: 🔄 Batch Download & Upload (With Cleanup)
        run: |
          RAW_URLS="${{ github.event.inputs.movie_urls }}"
          CLEAN_URLS=$(echo "$RAW_URLS" | tr ',' ' ' | tr '\n' ' ')
          
          mkdir -p movie_download
          
          for url in $CLEAN_URLS; do
            if [ -z "$url" ]; then continue; fi
            
            echo "=================================================="
            echo "🚀 PROCESSING: $url"
            echo "=================================================="
            
            cd movie_download
            aria2c -x 16 -s 16 --content-disposition --summary-interval=10 --console-log-level=warn "$url"
            cd ..
            
            rclone copy ./movie_download/ teldrive:${{ github.event.inputs.folder_name }}/ \
              --multi-thread-streams=8 --multi-thread-chunk-size=100M --use-mmap --stats 10s --stats-one-line -v
              
            rm -rf ./movie_download/*
            
            # 🔥 Ping the Telegram Bot when finished!
            if [ -n "${{ github.event.inputs.chat_id }}" ]; then
              curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -d chat_id="${{ github.event.inputs.chat_id }}" \
                -d text="✅ Upload Complete! Finished moving to ${{ github.event.inputs.folder_name }}"
            fi
            
          done
