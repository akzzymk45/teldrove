name: Upload Movie to TelDrive

on:
  workflow_dispatch:
    inputs:
      movie_url:
        description: 'Direct Download URL of the Movie (e.g., http://.../movie.mp4)'
        required: true
        type: string
      file_name:
        description: 'File Name to save as (e.g., Inception.mp4)'
        required: true
        type: string
      folder_name:
        description: 'Target Folder in TelDrive (e.g., Movies)'
        required: false
        default: 'Movies'
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: 📦 Clone Core TelDrive Backend
        uses: actions/checkout@v4
        with:
          repository: tgdrive/teldrive
          path: teldrive-backend

      - name: ⚙️ Install Rclone
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: 🌐 Start TelDrive Server in Background
        run: |
          cd teldrive-backend
          go run main.go run \
            --db-data-source="${{ secrets.TELDRIVE_SUPABASE_DSN }}" \
            --jwt-secret="${{ secrets.TELDRIVE_JWT_SECRET }}" \
            --tg-app-id="${{ secrets.TELDRIVE_TG_APP_ID }}" \
            --tg-app-hash="${{ secrets.TELDRIVE_TG_APP_HASH }}" \
            --tg-uploads-encryption-key="${{ secrets.TELDRIVE_TG_UPLOADS_ENCRYPTION_KEY }}" &
          
          # Wait 10 seconds to ensure the server is fully started
          sleep 10
          
      - name: 🔑 Configure Rclone Authentication
        run: |
          mkdir -p ~/.config/rclone
          cat <<EOF > ~/.config/rclone/rclone.conf
          [teldrive]
          type = webdav
          url = http://localhost:8080/webdav
          vendor = other
          bearer_token = ${{ secrets.TELDRIVE_TOKEN }}
          EOF

      - name: 📥 Download Movie to Runner
        run: |
          echo "Downloading movie from URL..."
          wget -q --show-progress -O "${{ github.event.inputs.file_name }}" "${{ github.event.inputs.movie_url }}"

      - name: ☁️ Upload Movie to Telegram via TelDrive
        run: |
          echo "Uploading to TelDrive Folder: ${{ github.event.inputs.folder_name }}"
          rclone copy "${{ github.event.inputs.file_name }}" teldrive:${{ github.event.inputs.folder_name }}/ -v --progress
          
      - name: 🧹 Cleanup Space
        run: rm -f "${{ github.event.inputs.file_name }}"
